<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bronx Vacant Lot Detection</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./main.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-title">
      <svg class="topbar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18"/>
        <path d="M9 21V9"/>
      </svg>
      <span>Bronx Vacant Lot Detection</span>
    </div>
    <a href="/playground" class="playground-link" title="Open Playground">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span>Playground</span>
    </a>
  </header>

  <!-- Main content -->
  <div class="main-row">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div id="slider-container"></div>

      <div class="sidebar-section">
        <h3 class="sidebar-heading">Layers</h3>
        <div id="layer-panel"></div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-heading">Error Map Legend</h3>
        <div class="legend">
          <div class="legend-item">
            <span class="legend-swatch" style="background:#22c55e;"></span>
            <span class="legend-label">True Positive</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background:#ef4444;"></span>
            <span class="legend-label">False Positive</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch" style="background:#3b82f6;"></span>
            <span class="legend-label">False Negative</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Map -->
    <div id="map"></div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <span id="footer-info">U-Net (ResNet-34) · Esri World Imagery</span>
    <a href="https://github.com" target="_blank" rel="noopener" class="footer-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">

      </svg>
      GitHub

  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
