[project]
name = "vacant-lot-detection-webapp"
version = "0.1.0"
description = "Interactive map for Bronx vacant lot detection predictions"
requires-python = ">=3.12"
dependencies = [
    "rio-tiler>=6.4",
    "rasterio",
    "scipy",
    "mercantile",
    "pillow",
    "tqdm",
    "click",
    "numpy",
    "pyyaml",
    "shapely",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "color-operations>=0.2.0",
    "httpx>=0.28.1",
]
