# Copy this file to config.local.yaml and fill in your local paths.
# config.local.yaml is gitignored — never commit it.

# External files produced by the training pipeline (generated once, not here)
data:
  pr_curves:      /path/to/outputs/models/deeplabv3plus/kahan_027/pr_curves.npz
  prediction_tif: /path/to/outputs/models/deeplabv3plus/kahan_027/figures/test_pred_s512.tif
  gt_mask:        /path/to/outputs/labels/vacancy_mask_v2.tif
  naip_vrt:       /path/to/data/imagery/naip/nyc/2022/naip_nyc_2022.vrt
  roads_geojson:  /path/to/data/geographic/nyc_roads.geojson

thresholds:
  default: 0.298
  good_zone: [0.298, 0.450]
  evaluation_thresholds: [0.0, 0.1, 0.2, 0.298, 0.32, 0.34, 0.36, 0.38, 0.40,
                          0.42, 0.44, 0.45, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
